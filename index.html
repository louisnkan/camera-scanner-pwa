
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="description" content="A fast, modern QR code and barcode scanner with live camera detection.">
<title>Live QR Scanner</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root {
  --bg: #09090B;
  --card: #18181B;
  --border: #27272A;
  --cyan: #06B6D4;
  --green: #10B981;
  --white: #FAFAFA;
  --silver: #A1A1AA;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--bg);
  color-scheme: dark;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--white);
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  overflow-x: hidden;
}

button {
  font: inherit;
  cursor: pointer;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 440px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: auto;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 13px;
  background: rgba(6,182,212,.12);
  border: 1px solid rgba(6,182,212,.35);
  display: grid;
  place-items: center;
  color: var(--cyan);
  font-size: 23px;
  box-shadow: 0 0 20px rgba(6,182,212,.12);
}

.brand h1 {
  font-size: 17px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.brand p {
  color: var(--silver);
  font-size: 11px;
  margin-top: 3px;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--silver);
  font-size: 11px;
  background: var(--card);
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 30px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #71717A;
}

.status.active .status-dot {
  background: var(--green);
  box-shadow: 0 0 9px var(--green);
}

.intro {
  text-align: center;
  margin-bottom: 27px;
}

.intro h2 {
  font-size: 25px;
  font-weight: 750;
  letter-spacing: -1px;
}

.intro p {
  color: var(--silver);
  font-size: 13px;
  margin-top: 9px;
  line-height: 1.6;
}

.scanner-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

.viewfinder {
  position: relative;
  width: 280px;
  height: 280px;
  max-width: 100%;
  background: #111114;
  border: 1px solid #27272A;
  border-radius: 19px;
  overflow: hidden;
  transition: border-color .25s, box-shadow .25s;
}

.viewfinder.success {
  border-color: var(--green);
  box-shadow: 0 0 25px rgba(16,185,129,.2);
}

#reader {
  width: 100%;
  height: 100%;
  border: 0 !important;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: 18px;
}

#reader img,
#reader canvas {
  display: none;
}

#reader__dashboard,
#reader__status_span,
#reader__header_message,
#reader__camera_selection,
#reader__filescan_input {
  display: none !important;
}

#reader__scan_region {
  min-height: 0 !important;
  border: none !important;
  background: transparent !important;
}

#reader__scan_region img {
  display: none !important;
}

#reader__scan_region canvas {
  display: none !important;
}

.corners {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  transition: color .25s;
  color: var(--cyan);
}

.corner {
  position: absolute;
  width: 36px;
  height: 36px;
  border-color: currentColor;
  border-style: solid;
  filter: drop-shadow(0 0 5px currentColor);
}

.top-left {
  top: 13px;
  left: 13px;
  border-width: 3px 0 0 3px;
  border-radius: 7px 0 0 0;
}

.top-right {
  top: 13px;
  right: 13px;
  border-width: 3px 3px 0 0;
  border-radius: 0 7px 0 0;
}

.bottom-left {
  bottom: 13px;
  left: 13px;
  border-width: 0 0 3px 3px;
  border-radius: 0 0 0 7px;
}

.bottom-right {
  bottom: 13px;
  right: 13px;
  border-width: 0 3px 3px 0;
  border-radius: 0 0 7px 0;
}

.viewfinder.success .corners {
  color: var(--green);
}

.laser {
  position: absolute;
  z-index: 4;
  left: 12%;
  width: 76%;
  height: 2px;
  top: 12%;
  background: var(--cyan);
  box-shadow: 0 0 9px 2px rgba(6,182,212,.65);
  opacity: .9;
  pointer-events: none;
  animation: scanning 2.7s ease-in-out infinite alternate;
}

.laser::after {
  content: "";
  position: absolute;
  inset: -5px 0;
  background: linear-gradient(
    transparent,
    rgba(6,182,212,.18),
    transparent
  );
}

@keyframes scanning {
  from { top: 12%; }
  to { top: 87%; }
}

.camera-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: none;
  background: #111114;
  transition: opacity .2s;
}

.camera-overlay.hidden {
  opacity: 0;
  visibility: hidden;
}

.camera-icon {
  font-size: 36px;
  margin-bottom: 12px;
  color: var(--cyan);
}

.camera-overlay p {
  color: var(--silver);
  font-size: 12px;
}

.scan-hint {
  text-align: center;
  color: var(--silver);
  font-size: 12px;
  margin-top: 13px;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.primary-btn {
  width: 100%;
  padding: 17px;
  border-radius: 13px;
  background: var(--cyan);
  color: #09090B;
  font-weight: 800;
  font-size: 14px;
  box-shadow: 0 0 20px rgba(6,182,212,.25);
  transition: transform .15s, opacity .15s;
}

.primary-btn:active,
.secondary-btn:active {
  transform: scale(.98);
}

.primary-btn:disabled {
  opacity: .5;
  cursor: wait;
}

.secondary-btn {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  background: #242428;
  border: 1px solid var(--border);
  color: var(--white);
  font-size: 14px;
  font-weight: 700;
}

.secondary-btn:disabled {
  opacity: .5;
}

.error-banner {
  display: none;
  padding: 13px;
  background: rgba(239,68,68,.09);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 12px;
  color: #FCA5A5;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 16px;
  overflow-wrap: anywhere;
}

.error-banner.visible {
  display: block;
}

.result-card {
  margin-top: 25px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 17px;
  display: none;
  animation: appear .25s ease;
}

.result-card.visible {
  display: block;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.result-title {
  font-size: 13px;
  font-weight: 750;
}

.success-label {
  background: rgba(16,185,129,.12);
  color: var(--green);
  border-radius: 20px;
  padding: 6px 9px;
  font-size: 10px;
  font-weight: 800;
}

.result-content {
  padding: 14px;
  background: #101013;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--white);
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  word-break: break-word;
  max-height: 160px;
  overflow-y: auto;
  user-select: text;
}

.result-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 13px;
}

.result-actions.single {
  grid-template-columns: 1fr;
}

.action-btn {
  padding: 12px 8px;
  border-radius: 10px;
  background: #27272A;
  color: var(--white);
  font-size: 12px;
  font-weight: 750;
  border: 1px solid #3F3F46;
}

.action-btn.copied {
  background: rgba(16,185,129,.13);
  color: var(--green);
  border-color: rgba(16,185,129,.35);
}

.action-btn.open {
  background: rgba(6,182,212,.1);
  color: var(--cyan);
  border-color: rgba(6,182,212,.3);
}

footer {
  text-align: center;
  margin-top: auto;
  padding-top: 30px;
  color: #71717A;
  font-size: 10px;
  letter-spacing: .3px;
}

footer span {
  color: var(--cyan);
}

@media(max-height: 720px) {
  .app {
    padding-top: 15px;
  }
  header {
    margin-bottom: 20px;
  }
  .intro {
    margin-bottom: 17px;
  }
  .viewfinder {
    width: 260px;
    height: 260px;
  }
}

@media(prefers-reduced-motion: reduce) {
  .laser {
    animation: none;
    top: 50%;
  }
  * {
    animation-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="app">

  <header>
    <div class="brand">
      <div class="logo">⌗</div>
      <div>
        <h1>SCAN<span style="color:#06B6D4">X</span></h1>
        <p>LIVE QR & BARCODE SCANNER</p>
      </div>
    </div>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span id="statusText">Offline</span>
    </div>
  </header>

  <section class="intro">
    <h2>Scan Anything.</h2>
    <p>Point your camera at a QR code or barcode<br>
    to instantly decode its contents.</p>
  </section>

  <div class="scanner-wrapper">
    <div class="viewfinder" id="viewfinder">

      <div id="reader"></div>

      <div class="camera-overlay" id="cameraOverlay">
        <div class="camera-icon">▣</div>
        <p>Camera is waiting to start</p>
      </div>

      <div class="corners">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
      </div>

      <div class="laser" id="laser"></div>

    </div>
  </div>

  <p class="scan-hint" id="scanHint">
    Position a code inside the scanning frame
  </p>

  <div style="height:20px"></div>

  <div class="error-banner" id="errorBanner" role="alert"></div>

  <section class="controls">
    <button class="primary-btn" id="startBtn">
      Start Camera
    </button>

    <button class="secondary-btn" id="stopBtn" hidden>
      Stop Camera
    </button>
  </section>

  <section class="result-card" id="resultCard" aria-live="polite">

    <div class="result-header">
      <span class="result-title">Scan Result</span>
      <span class="success-label">✓ DECODED</span>
    </div>

    <div class="result-content" id="resultText"></div>

    <div class="result-actions" id="resultActions">
      <button class="action-btn" id="copyBtn">
        Copy Result
      </button>

      <button class="action-btn open" id="openBtn" hidden>
        Open Link ↗
      </button>
    </div>

  </section>

  <footer>
    POWERED BY <span>SCANX ENGINE</span> · PRIVATE SCANNING
  </footer>

</main>

<script>
"use strict";

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const status = document.getElementById("status");
const statusText = document.getElementById("statusText");
const viewfinder = document.getElementById("viewfinder");
const cameraOverlay = document.getElementById("cameraOverlay");
const errorBanner = document.getElementById("errorBanner");
const resultCard = document.getElementById("resultCard");
const resultText = document.getElementById("resultText");
const copyBtn = document.getElementById("copyBtn");
const openBtn = document.getElementById("openBtn");
const scanHint = document.getElementById("scanHint");
const resultActions = document.getElementById("resultActions");

let scanner = null;
let cameraRunning = false;
let isStarting = false;
let lastResult = "";
let copyTimer = null;
let scanLock = false;

function setStatus(active, message) {
  status.classList.toggle("active", active);
  statusText.textContent = message;
}

function showError(message) {
  errorBanner.textContent = message;
  errorBanner.classList.add("visible");
}

function hideError() {
  errorBanner.textContent = "";
  errorBanner.classList.remove("visible");
}

function resetSuccess() {
  viewfinder.classList.remove("success");
}

function getErrorMessage(error) {
  const message = String(error?.message || error || "").toLowerCase();

  if (
    message.includes("notallowederror") ||
    message.includes("permission denied") ||
    message.includes("permission")
  ) {
    return "Camera access was denied. Allow camera permission in your browser settings and try again.";
  }

  if (
    message.includes("notfounderror") ||
    message.includes("no camera")
  ) {
    return "No camera was found on this device.";
  }

  if (
    message.includes("notreadableerror") ||
    message.includes("could not start video source")
  ) {
    return "Your camera may be in use by another application. Close other camera apps and try again.";
  }

  if (
    message.includes("secure") ||
    message.includes("https")
  ) {
    return "Camera access requires HTTPS. Open this app using its secure Vercel or GitHub Pages address.";
  }

  return "Unable to start the camera. Check your camera permissions and try again.";
}

async function startCamera() {
  if (cameraRunning || isStarting) return;

  hideError();
  resetSuccess();

  if (typeof Html5Qrcode === "undefined") {
    showError("Scanner library could not load. Check your internet connection and reload the application.");
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    showError("Your browser does not support camera access. Open this app using HTTPS in a supported browser.");
    return;
  }

  isStarting = true;
  startBtn.disabled = true;
  startBtn.textContent = "Starting Camera...";

  try {
    if (!scanner) {
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.PDF_417,
          Html5QrcodeSupportedFormats.AZTEC
        ],
        verbose: false
      });
    }

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(width, height) {
          const size = Math.floor(Math.min(width, height) * 0.82);
          return { width: size, height: size };
        },
        aspectRatio: 1,
        disableFlip: false
      },
      onScanSuccess,
      () => {}
    );

    cameraRunning = true;
    scanLock = false;

    cameraOverlay.classList.add("hidden");
    startBtn.hidden = true;
    stopBtn.hidden = false;
    stopBtn.disabled = false;

    setStatus(true, "Camera Active");
    scanHint.textContent = "Scanning... Hold your code steady";

  } catch (error) {
    console.error("Camera error:", error);
    showError(getErrorMessage(error));
    setStatus(false, "Camera Error");

    if (scanner) {
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }
        scanner.clear();
      } catch (cleanupError) {
        console.warn("Camera cleanup:", cleanupError);
      }
      scanner = null;
    }

    cameraOverlay.classList.remove("hidden");

  } finally {
    isStarting = false;
    startBtn.disabled = false;
    startBtn.textContent = "Start Camera";
  }
}

function onScanSuccess(decodedText, decodedResult) {
  if (scanLock || !decodedText) return;

  scanLock = true;
  lastResult = decodedText;

  if (navigator.vibrate) {
    navigator.vibrate(200);
  }

  viewfinder.classList.add("success");

  resultText.textContent = decodedText;
  resultCard.classList.add("visible");

  copyBtn.textContent = "Copy Result";
  copyBtn.classList.remove("copied");

  const isLink = /^https?:\/\//i.test(decodedText);

  openBtn.hidden = !isLink;
  resultActions.classList.toggle("single", !isLink);

  if (isLink) {
    openBtn.onclick = function() {
      const safeURL = new URL(decodedText);

      if (safeURL.protocol === "http:" || safeURL.protocol === "https:") {
        window.open(safeURL.href, "_blank", "noopener,noreferrer");
      }
    };
  }

  scanHint.textContent = "✓ Code successfully detected";

  setStatus(true, "Scan Successful");

  if (scanner && scanner.isScanning) {
    try {
      scanner.pause(true);
    } catch (error) {
      console.warn("Scanner pause:", error);
    }
  }

  console.log("Decoded:", decodedText);
  console.log("Scan details:", decodedResult);
}

async function stopCamera() {
  if (!scanner || !cameraRunning) return;

  stopBtn.disabled = true;
  stopBtn.textContent = "Stopping...";

  try {
    if (scanner.isScanning) {
      await scanner.stop();
    }

    scanner.clear();

  } catch (error) {
    console.error("Stop camera error:", error);

  } finally {
    scanner = null;
    cameraRunning = false;
    scanLock = false;

    cameraOverlay.classList.remove("hidden");
    startBtn.hidden = false;
    stopBtn.hidden = true;
    stopBtn.disabled = false;
    stopBtn.textContent = "Stop Camera";

    setStatus(false, "Camera Stopped");
    scanHint.textContent = "Position a code inside the scanning frame";

    resetSuccess();
  }
}

async function copyResult() {
  if (!lastResult) return;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(lastResult);
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = lastResult;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();

      const copied = document.execCommand("copy");
      textarea.remove();

      if (!copied) throw new Error("Copy failed");
    }

    copyBtn.textContent = "✓ Copied!";
    copyBtn.classList.add("copied");

    if (copyTimer) clearTimeout(copyTimer);

    copyTimer = setTimeout(() => {
      copyBtn.textContent = "Copy Result";
      copyBtn.classList.remove("copied");
    }, 2000);

  } catch (error) {
    console.error("Clipboard error:", error);
    copyBtn.textContent = "Copy Failed";
  }
}

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);
copyBtn.addEventListener("click", copyResult);

document.addEventListener("visibilitychange", () => {
  if (document.hidden && cameraRunning && scanner?.isScanning) {
    scanner.pause(true);
    scanHint.textContent = "Scanner paused while app is in background";
  } else if (!document.hidden && cameraRunning && scanner?.isPaused) {
    scanner.resume();
    scanHint.textContent = "Scanning... Hold your code steady";
  }
});

// Register the PWA service worker.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register("./sw.js");
      console.log("SCANX service worker registered.");
    } catch (error) {
      console.error("Service worker registration failed:", error);
    }
  });
}

window.addEventListener("beforeunload", () => {
  if (scanner?.isScanning) {
    scanner.stop().catch(() => {});
  }
});
</script>

</body>
</html>
